    condition_inputs:
      name: Condition Inputs
      icon: mdi:help-box-multiple
      description: These inputs are used to set the automation conditions
      input:
        should_suspend_after_manual_interaction:
          # translation:
          #   name:
          #     en: Suspend After Manual Interaction
          #     de: Aussetzen nach manueller Bedienung
          #   description:
          #     en: If somebody operates a cover by hand, should the automation leave that cover alone for a while? Manual control means through the app or a wall switch, even when stopping a cover mid-move. All other covers keep automating.
          #     de: Soll die Automation eine Store in Ruhe lassen, wenn jemand sie von Hand bedient? Manuelle Bedienung heisst über die App oder Wandschalter, auch das Stoppen während der Fahrt. Alle anderen Storen laufen normal weiter.
          # optional: false
          # display_if: true
          name: Suspend After Manual Interaction
          description: >
            If covers are controlled manually, suspend the automation for the
            affected cover for a specified amount of time (see `Suspension Duration`).

            Manual control means the app or a wall switch, even when stopping a cover mid-move.
            The cover keeps its manual position until the next scheduled transition after the
            suspension has expired. All other covers keep automating.
          selector:
            boolean:
          default: true
        suspension_duration:
          # translation:
          #   name:
          #     en: Suspension Duration
          #     de: Dauer der Aussetzung
          #   description:
          #     en: How long should the automation leave a manually operated cover alone? The cover keeps its manual position until the next scheduled transition after this duration has expired.
          #     de: Wie lange soll die Automation eine von Hand bediente Store in Ruhe lassen? Die Store behält ihre manuelle Position bis zum nächsten geplanten Wechsel, nachdem diese Dauer abgelaufen ist.
          # optional: false
          # display_if: should_suspend_after_manual_interaction == true
          name: Suspension Duration (optional)
          description: If suspension after manual interaction is turned on, this setting specifies how long the suspension should last.
          selector:
            time:
          default: "00:30:00"

        weather_events:
          # translation:
          #   name:
          #     en: Weather Events to Prevent Extending
          #     de: Wetterereignisse die das Ausfahren verhindern
          #   description:
          #     en: Which weather events should prevent the covers from extending during the day-night cycle? The automation checks the current conditions and the forecast for the next hour. Weather only blocks extension - retraction is always safe. The automation extends the covers as soon as the weather clears. This automation does not block manual operation during weather events and also does not retract already extended covers.
          #     de: Welche Wetterereignisse sollen das Ausfahren der Storen während des Tag-Nacht-Zyklus verhindern? Die Automation prüft das aktuelle Wetter und die Vorhersage für die nächste Stunde. Wetter blockiert nur das Ausfahren - das Einfahren ist immer unbedenklich. Die Automation fährt die Storen aus, sobald sich das Wetter beruhigt hat. Diese Automation blockiert die manuelle Bedienung bei Wetterereignissen nicht und fährt bereits ausgefahrene Storen auch nicht ein.
          # optional: true
          # display_if: true
          name: Weather Events to Prevent Extending (optional)
          description: >
            Which weather events (current or forecast within the next hour) should prevent the
            covers from extending? Requires the `Weather Entity` to be set.

            Weather events only prevent the covers from extending - retracting is always safe. While
            blocked, the automation retries every minute and extends the covers as soon as the
            weather clears. This automation does not block manual operation during weather
            events and also does not retract already extended covers.
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: High Wind Speeds
                  # translation:
                  #   label:
                  #     en: High Wind Speeds
                  #     de: Hohe Windgeschwindigkeiten
                  value: "windy"
                - label: Rainy
                  # translation:
                  #   label:
                  #     en: Rainy
                  #     de: Regen
                  value: "rainy"
                - label: Pouring
                  # translation:
                  #   label:
                  #     en: Pouring
                  #     de: Starkregen
                  value: "pouring"
                - label: Lightning
                  # translation:
                  #   label:
                  #     en: Lightning
                  #     de: Blitzschlag
                  value: "lightning"
                - label: Lightning, rainy
                  # translation:
                  #   label:
                  #     en: Lightning and rainy
                  #     de: Blitzschlag mit Regen
                  value: "lightning-rainy"
                - label: Hail
                  # translation:
                  #   label:
                  #     en: Hail
                  #     de: Hagel
                  value: "hail"
                - label: Snowy
                  # translation:
                  #   label:
                  #     en: Snowy
                  #     de: Schnee
                  value: "snowy"
                - label: Snowy, rainy
                  # translation:
                  #   label:
                  #     en: Snowy and rainy
                  #     de: Schneeregen
                  value: "snowy-rainy"
                - label: Fog
                  # translation:
                  #   label:
                  #     en: Fog
                  #     de: Nebel
                  value: "fog"
          default: []
        weather_entity:
          # translation:
          #   name:
          #     en: Weather Entity
          #     de: Wetter-Entität
          #   description:
          #     en: Which weather entity should the automation check? Without it, the selected weather events cannot block the extension.
          #     de: Welche Wetter-Entität soll die Automation prüfen? Ohne sie können die gewählten Wetterereignisse das Ausfahren nicht verhindern.
          # optional: false
          # display_if: not (isEmpty(weather_events))
          name: Weather Entity (optional)
          description: The weather entity to check in order to block the extension of the covers. This is required if you want to block the extension of the covers based on weather conditions/forecasts.
          selector:
            entity:
              filter:
                - domain: weather
          default: ""
        rain_sensor:
          # translation:
          #   name:
          #     en: Rain Sensor
          #     de: Regensensor
          #   description:
          #     en: If you have one, add a separate moisture sensor as a real-time check for rain. It blocks extending while it reports moisture. Without a sensor, only your weather service is checked.
          #     de: Falls vorhanden, ergänze einen separaten Feuchtigkeitssensor als Echtzeit-Prüfung für Regen. Er verhindert das Ausfahren, solange er Feuchtigkeit meldet. Ohne Sensor wird nur Dein Wetterdienst geprüft.
          # optional: true
          # display_if: includesAny(weather_events, ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'snowy-rainy'])
          name: Rain Sensor (optional)
          description: >
            If available, specify a separate moisture sensor to be used to track if it's currently raining.
            Blocks extending while `on`, but only if you selected a rain-type weather event above
            (rainy, pouring, lightning, lightning-rainy or snowy-rainy). Without a sensor, only the
            `Weather Entity` is checked. Must be of device_class `moisture`.
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: moisture
          default: ""
        wind_sensor:
          # translation:
          #   name:
          #     en: Wind Sensor
          #     de: Windsensor
          #   description:
          #     en: If you have one, add a separate wind sensor as a real-time check for wind speed. It blocks extending above the threshold. Without a wind sensor, the wind speed of your weather service is used.
          #     de: Falls vorhanden, ergänze einen separaten Windsensor als Echtzeit-Prüfung der Windgeschwindigkeit. Er verhindert das Ausfahren oberhalb des Schwellenwerts. Ohne Windsensor wird die Windgeschwindigkeit Deines Wetterdienstes verwendet.
          # optional: true
          # display_if: includes(weather_events, 'windy')
          name: Wind Sensor (optional)
          description: >
            If available, specify a separate wind sensor to be used to track current wind speeds.
            Blocks extending above the threshold, but only if you selected `High Wind Speeds` above.
            Without a wind sensor, the `wind_speed` of the `Weather Entity` is used instead.
            Must be of device_class `wind_speed`.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: wind_speed
          default: ""
        wind_speed_threshold:
          # translation:
          #   name:
          #     en: Wind Speed Threshold to Prevent Extending
          #     de: Windgeschwindigkeit die das Ausfahren verhindert
          #   description:
          #     en: Above which wind speed should the covers stay retracted? The automation checks the current wind speed (from the wind sensor, or else from your weather service) and the forecast for the next hour.
          #     de: Ab welcher Windgeschwindigkeit sollen die Storen eingefahren bleiben? Die Automation prüft die aktuelle Windgeschwindigkeit (vom Windsensor, sonst von Deinem Wetterdienst) und die Vorhersage für die nächste Stunde.
          # optional: true
          # display_if: includes(weather_events, 'windy')
          name: Wind Speed Threshold to Prevent Extending (optional)
          description: >
            At what wind speed should the covers be prevented from extending? Checked against the
            current wind speed (the `Wind Sensor` if set, otherwise the `wind_speed` of the
            `Weather Entity`) and the hourly forecast for the next hour. Speeds in other units
            are converted to km/h.
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: km/h
          default: 35
        wind_speed_threshold_helper:
          # translation:
          #   name:
          #     en: Wind Speed Threshold Helper
          #     de: Helfer Windgeschwindigkeit
          #   description:
          #     en: Instead of setting the wind speed threshold in this automation, use a number helper.
          #     de: Statt den Schwellenwert in dieser Automation zu setzen, kannst Du einen Number-Helfer verwenden.
          # optional: true
          # display_if: false
          name: Wind Speed Threshold Helper (optional)
          description: Instead of setting the wind speed threshold within this automation, you can use a number helper to set the wind speed threshold.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

    action_inputs:
      name: Action Inputs
      icon: mdi:play-box-multiple
      description: These inputs are used to set the actions.
      input:
        cover_entity:
          # translation:
          #   name:
          #     en: Cover(s)
          #     de: Store(n)
          #   description:
          #     en: Which covers should this automation control? Select individual covers rather than cover groups, so manual operation is detected reliably. Please note that covers can extend while people are outside. Leave the covers of balcony and garden doors out, so nobody gets locked out. Only shutters, blinds, shades and curtains can be selected. Awnings and windows are not supported by this automation.
          #     de: Welche Storen soll diese Automation steuern? Wähle einzelne Storen statt Storen-Gruppen, damit die manuelle Bedienung zuverlässig erkannt wird. Beachte, dass Storen ausfahren können, während sich Personen draussen befinden. Lass die Storen von Balkon- und Gartentüren weg, damit sich niemand aussperrt. Nur Storen, Jalousien, Rollos und Vorhänge können gewählt werden. Sonnenstoren und Fenster werden durch diese Automatisierung nicht unterstützt.
          # optional: false
          # display_if: true
          name: Cover(s)
          description: >
            The cover entities to automate. Please select individual covers rather than
            cover groups (see limitations). Please beware that covers might extend while
            people are outside (balcony/garden). Leave the covers of balcony and garden
            doors out of this automation, so nobody gets locked out.

            Only covers with the device class `shutter`, `blind`, `shade` or `curtain`
            can be selected. Awnings and windows are not supported by this automation.
          selector:
            entity:
              filter:
                - domain: cover
                  device_class:
                    - shutter
                    - blind
                    - shade
                    - curtain
              multiple: true

    custom_inputs:
      name: "DANGER ZONE: Additional Custom Inputs"
      icon: mdi:alert
      description: >-
        **WATCH OUT!**

        This is advanced functionality and should only be used if you know what you're doing!


        Use this section to define custom triggers and conditions, as well as actions
        that will run after the covers have been retracted/extended.
      collapsed: true
      input:
        custom_opening_triggers:
          name: Custom Retract Triggers (optional)
          description: >-
            Use this to define custom retract triggers in addition to the default triggers. Make sure each one of them has the trigger id `custom_open`.
          selector:
            trigger:
          default: []
        custom_closing_triggers:
          name: Custom Extend Triggers (optional)
          description: >-
            Use this to define custom extend triggers in addition to the default triggers. Make sure each one of them has the trigger id `custom_close`.
          selector:
            trigger:
          default: []
        custom_opening_conditions:
          name: Custom Retract Conditions (optional)
          description: >-
            Use this to define custom conditions that must ALL pass before the covers are retracted by this automation.
          selector:
            condition:
          default: []
        custom_closing_conditions:
          name: Custom Extend Conditions (optional)
          description: >-
            Use this to define custom conditions that must ALL pass before the covers are extended by this automation.
          selector:
            condition:
          default: []
        custom_opening_actions:
          name: Custom Retract Actions (optional)
          description: >-
            Use this to define custom actions that should be executed after covers have been retracted by this automation.
          selector:
            action:
          default: []
        custom_closing_actions:
          name: Custom Extend Actions (optional)
          description: >-
            Use this to define custom actions that should be executed after covers have been extended by this automation.
          selector:
            action:
          default: []

#############
# Variables #
#############
# All settings are resolved here (priority: helper entity -> blueprint input).
# Triggers stay dumb (variables are not available in triggers); the decision
# logic below only ever uses resolved variables.
variables:
  instance_id: "{{ this.attributes.id | string }}"
  now_ts: "{{ as_timestamp(now()) }}"
  # This blueprint's own namespace in the central tracker. Holds this instance's
  # brightness stabilizer bookkeeping keys: <id>::bright_since / <id>::dark_since.
  # The last-commanded position lives in shared.<id>::intent instead (see
  # my_intent/last_commanded below) — the intent is the single record.
  stored_state: "{{ (state_attr('sensor.smarli_automation_tracker', 'data') or {}).get('cover_day_night', {}) }}"

  daynight_cycle_method: !input daynight_cycle_method
  should_suspend_after_manual_interaction: !input should_suspend_after_manual_interaction

  workday_tracker: !input workday_tracker
  workday_tomorrow_tracker: !input workday_tomorrow_tracker
  is_workday: "{{ workday_tracker != '' and is_state(workday_tracker, 'on') }}"
  is_workday_tomorrow: "{{ workday_tomorrow_tracker != '' and is_state(workday_tomorrow_tracker, 'on') }}"

  # --- sun method -----------------------------------------------------------
  sunrise_offset_input: !input sunrise_offset
  sunrise_offset_helper: !input sunrise_offset_helper
  # Offset in seconds, resolved from helper or input. May be negative (open
  # before actual sunrise) — the arithmetic below handles negatives fine.
  sunrise_offset_seconds: >
    {% set minutes = states(sunrise_offset_helper) | float(sunrise_offset_input)
       if sunrise_offset_helper != '' else sunrise_offset_input %}
    {{ minutes | float(0) * 60 }}
  sunset_offset_input: !input sunset_offset
  sunset_offset_helper: !input sunset_offset_helper
  sunset_offset_seconds: >
    {% set minutes = states(sunset_offset_helper) | float(sunset_offset_input)
       if sunset_offset_helper != '' else sunset_offset_input %}
    {{ minutes | float(0) * 60 }}
  # sun.sun's next_rising/next_setting always point to the future; subtract a day
  # when they already point to tomorrow to get *today's* event (approx, +-2 min).
  todays_sunrise: >
    {% set next = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
    {% if next == 0 %}
      0
    {% elif next | timestamp_custom('%j') == now_ts | timestamp_custom('%j') %}
      {{ next }}
    {% else %}
      {{ next - 86400 }}
    {% endif %}
  todays_sunset: >
    {% set next = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
    {% if next == 0 %}
      0
    {% elif next | timestamp_custom('%j') == now_ts | timestamp_custom('%j') %}
      {{ next }}
    {% else %}
      {{ next - 86400 }}
    {% endif %}

  # --- time method ----------------------------------------------------------
  # Resolution pattern used throughout: pick the workday or non-workday value,
  # prefer the helper entity's value over the blueprint input, and fall back to
  # the input default if the helper is empty or doesn't hold a time.
  time_open_workday: !input time_open_workday
  time_open_workday_helper: !input time_open_workday_helper
  time_open_non_workday: !input time_open_non_workday
  time_open_non_workday_helper: !input time_open_non_workday_helper
  open_time: >
    {% set helper = time_open_workday_helper if is_workday else time_open_non_workday_helper %}
    {% set fallback = time_open_workday if is_workday else time_open_non_workday %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}
  time_close_workday_tomorrow: !input time_close_workday_tomorrow
  time_close_workday_tomorrow_helper: !input time_close_workday_tomorrow_helper
  time_close_non_workday_tomorrow: !input time_close_non_workday_tomorrow
  time_close_non_workday_tomorrow_helper: !input time_close_non_workday_tomorrow_helper
  close_time: >
    {% set helper = time_close_workday_tomorrow_helper if is_workday_tomorrow else time_close_non_workday_tomorrow_helper %}
    {% set fallback = time_close_workday_tomorrow if is_workday_tomorrow else time_close_non_workday_tomorrow %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}

  # --- brightness method ----------------------------------------------------
  brightness_sensor: !input brightness_sensor
  lux_sensor_delay: !input lux_sensor_delay
  # How long brightness must stay past a threshold before acting (the stabilizer).
  stabilizer_seconds: "{{ (lux_sensor_delay | as_timedelta).total_seconds() }}"
  brightness_open_input: !input brightness_open
  brightness_open_helper: !input brightness_open_helper
  open_lux_level: >
    {{ states(brightness_open_helper) | float(brightness_open_input)
       if brightness_open_helper != '' else brightness_open_input }}
  brightness_close_input: !input brightness_close
  brightness_close_helper: !input brightness_close_helper
  close_lux_level: >
    {{ states(brightness_close_helper) | float(brightness_close_input)
       if brightness_close_helper != '' else brightness_close_input }}
  lux: "{{ states(brightness_sensor) | float(-1) if brightness_sensor != '' else -1 }}"
  # Instantaneous readings (before the stabilizer delay is applied).
  bright_enough_to_open: "{{ daynight_cycle_method == 'brightness' and lux >= 0 and lux >= open_lux_level | float(0) }}"
  dark_enough_to_close: "{{ daynight_cycle_method == 'brightness' and lux >= 0 and lux <= close_lux_level | float(0) }}"
  # Timestamps (from the tracker) of when each threshold was first crossed.
  bright_since: "{{ stored_state.get(instance_id ~ '::bright_since') }}"
  dark_since: "{{ stored_state.get(instance_id ~ '::dark_since') }}"
  # True when the stored "since" timestamps no longer match the current reading,
  # so the stabilizer bookkeeping needs to write/clear one of them this run.
  stabilizer_needs_update: >
    {{ daynight_cycle_method == 'brightness' and (
         (bright_enough_to_open and bright_since is none) or (not bright_enough_to_open and bright_since is not none)
         or (dark_enough_to_close and dark_since is none) or (not dark_enough_to_close and dark_since is not none)
       ) }}
  # Sun-anchored directionality for the brightness method: brightness alone can't
  # tell "dark because evening" from "dark because a midday storm" — a lux
  # threshold has no time direction. Fence each transition to a window anchored on
  # today's sunrise/sunset (see todays_sunrise/todays_sunset above). Brightness may
  # LEAD the sun event by at most this offset (bright mornings / overcast dusks) and
  # LAG freely until the opposite phase. Constant (not an input) to keep the UI
  # simple; tune here. Without this a midday storm arms the close and a 3am light
  # arms the open.
  brightness_offset_sunrise_sunset: 3600 # 60 min
  # Open armed from the morning boundary (sunrise - offset) until the evening
  # boundary (sunset - offset) — the day half.
  brightness_open_armed: >
    {{ todays_sunrise | float(0) > 0 and todays_sunset | float(0) > 0
       and now_ts >= todays_sunrise | float(0) - brightness_offset_sunrise_sunset
       and now_ts <  todays_sunset  | float(0) - brightness_offset_sunrise_sunset }}
  # Close armed from the evening boundary onward — the night half. One-sided: after
  # midnight todays_sunset points at the new day's (future) sunset, so this falls
  # false again in the small hours — no re-close overnight.
  brightness_close_armed: >
    {{ todays_sunset | float(0) > 0
       and now_ts >= todays_sunset | float(0) - brightness_offset_sunrise_sunset }}

  # --- earliest / latest ----------------------------------------------------
  should_use_earliest_open: !input should_use_earliest_open
  earliest_open_workday: !input earliest_open_workday
  earliest_open_workday_helper: !input earliest_open_workday_helper
  earliest_open_non_workday: !input earliest_open_non_workday
  earliest_open_non_workday_helper: !input earliest_open_non_workday_helper
  earliest_open_time: >
    {% set helper = earliest_open_workday_helper if is_workday else earliest_open_non_workday_helper %}
    {% set fallback = earliest_open_workday if is_workday else earliest_open_non_workday %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}
  should_use_earliest_close: !input should_use_earliest_close
  earliest_close_workday_tomorrow: !input earliest_close_workday_tomorrow
  earliest_close_workday_tomorrow_helper: !input earliest_close_workday_tomorrow_helper
  earliest_close_non_workday_tomorrow: !input earliest_close_non_workday_tomorrow
  earliest_close_non_workday_tomorrow_helper: !input earliest_close_non_workday_tomorrow_helper
  earliest_close_time: >
    {% set helper = earliest_close_workday_tomorrow_helper if is_workday_tomorrow else earliest_close_non_workday_tomorrow_helper %}
    {% set fallback = earliest_close_workday_tomorrow if is_workday_tomorrow else earliest_close_non_workday_tomorrow %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}
  should_use_latest_open: !input should_use_latest_open
  latest_open_workday: !input latest_open_workday
  latest_open_workday_helper: !input latest_open_workday_helper
  latest_open_non_workday: !input latest_open_non_workday
  latest_open_non_workday_helper: !input latest_open_non_workday_helper
  latest_open_time: >
    {% set helper = latest_open_workday_helper if is_workday else latest_open_non_workday_helper %}
    {% set fallback = latest_open_workday if is_workday else latest_open_non_workday %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}
  should_use_latest_close: !input should_use_latest_close
  latest_close_workday_tomorrow: !input latest_close_workday_tomorrow
  latest_close_workday_tomorrow_helper: !input latest_close_workday_tomorrow_helper
  latest_close_non_workday_tomorrow: !input latest_close_non_workday_tomorrow
  latest_close_non_workday_tomorrow_helper: !input latest_close_non_workday_tomorrow_helper
  latest_close_time: >
    {% set helper = latest_close_workday_tomorrow_helper if is_workday_tomorrow else latest_close_non_workday_tomorrow_helper %}
    {% set fallback = latest_close_workday_tomorrow if is_workday_tomorrow else latest_close_non_workday_tomorrow %}
    {% set value = states(helper) if helper != '' else fallback %}
    {{ value if ':' in value else fallback }}

  # --- weather ---------------------------------------------------------------
  weather_events: !input weather_events
  weather_entity: !input weather_entity
  rain_sensor: !input rain_sensor
  wind_sensor: !input wind_sensor
  wind_speed_threshold_input: !input wind_speed_threshold
  wind_speed_threshold_helper: !input wind_speed_threshold_helper
  wind_speed_limit: >
    {{ states(wind_speed_threshold_helper) | float(wind_speed_threshold_input)
       if wind_speed_threshold_helper != '' else wind_speed_threshold_input }}
  # Do any selected weather events correspond to each dedicated sensor? The
  # sensors are real-time proxies, so they only block if the user actually asked
  # to block on that kind of weather. wet_events = precipitation-type conditions
  # (the ones a moisture sensor stands in for); wind is the 'windy' condition.
  wet_events: "{{ ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'snowy-rainy'] }}"
  rain_events_selected: "{{ weather_events | select('in', wet_events) | list | count > 0 }}"
  wind_events_selected: "{{ 'windy' in weather_events }}"
  # The threshold is in km/h; sensors and weather entities report in their own
  # unit. A unit missing from this table (e.g. Beaufort) makes the speed
  # unknown rather than being compared raw against a km/h limit.
  wind_unit_to_kmh:
    "km/h": 1
    "m/s": 3.6
    "mph": 1.609344
    "kn": 1.852
    "ft/s": 1.09728
  # Current wind speed in km/h: the dedicated sensor if set, otherwise the
  # weather entity's wind_speed attribute. -1 = unknown, never blocks. A sensor
  # without a unit is taken as km/h, matching the pre-conversion behavior.
  current_wind_kmh: >
    {% if wind_sensor != '' %}
      {% set v = states(wind_sensor) %}
      {% set u = state_attr(wind_sensor, 'unit_of_measurement') %}
      {% set f = 1 if u in [none, ''] else wind_unit_to_kmh.get(u) %}
    {% elif weather_entity != '' %}
      {% set v = state_attr(weather_entity, 'wind_speed') %}
      {% set f = wind_unit_to_kmh.get(state_attr(weather_entity, 'wind_speed_unit')) %}
    {% else %}
      {% set v = none %}
      {% set f = none %}
    {% endif %}
    {{ (v | float * f) | round(1) if (v is not none and v | is_number and f is not none) else -1 }}
  # Closing is blocked right now if the weather entity currently reports a
  # blocked condition, OR a relevant dedicated sensor trips, OR the wind speed
  # reaches the threshold (each only when the matching weather event was selected).
  weather_blocked_now: >
    {{ (weather_entity != '' and weather_events | count > 0 and states(weather_entity) in weather_events)
       or (rain_sensor != '' and rain_events_selected and is_state(rain_sensor, 'on'))
       or (wind_events_selected and current_wind_kmh | float(-1) >= 0
           and current_wind_kmh | float(-1) >= wind_speed_limit | float(0)) }}

  # --- covers -----------------------------------------------------------------
  cover_entity: !input cover_entity
  # expand() flattens any selected cover *groups* into their member covers (and
  # passes plain covers through unchanged); map() turns the state objects back
  # into a flat list of entity_ids. Without groups this is just the input list.
  cover_entities: "{{ expand(cover_entity) | map(attribute='entity_id') | list }}"

  # --- decision engine ------------------------------------------------------
  # Targets are numeric positions (see smarli_cover.yaml): 100 = open, 0 = closed.
  # The day-night cycle only ever uses these two, but numbers let the shared move
  # script drive position-capable and binary covers with the same call.
  suspension_duration: !input suspension_duration
  position_open: 100
  position_closed: 0

  # Which phase does the schedule put us in right now? Each combines the chosen
  # method with the optional earliest (delays) and latest (forces) time windows.
  schedule_wants_open: >
    {% if daynight_cycle_method == 'sun' %}
      {% set due = todays_sunrise | float(0) > 0 and now_ts >= todays_sunrise | float(0) + sunrise_offset_seconds | float(0) %}
    {% elif daynight_cycle_method == 'time' %}
      {% set due = now_ts >= as_timestamp(today_at(open_time)) %}
    {% else %}
      {% set due = brightness_open_armed and bright_since is not none and (now_ts - bright_since | float(0)) >= stabilizer_seconds | float(0) %}
    {% endif %}
    {% if should_use_earliest_open and now_ts < as_timestamp(today_at(earliest_open_time)) %}{% set due = false %}{% endif %}
    {% if should_use_latest_open and now_ts >= as_timestamp(today_at(latest_open_time)) %}{% set due = true %}{% endif %}
    {{ due }}
  schedule_wants_closed: >
    {% if daynight_cycle_method == 'sun' %}
      {% set due = todays_sunset | float(0) > 0 and now_ts >= todays_sunset | float(0) + sunset_offset_seconds | float(0) %}
    {% elif daynight_cycle_method == 'time' %}
      {% set due = now_ts >= as_timestamp(today_at(close_time)) %}
    {% else %}
      {% set due = brightness_close_armed and dark_since is not none and (now_ts - dark_since | float(0)) >= stabilizer_seconds | float(0) %}
    {% endif %}
    {% if should_use_earliest_close and now_ts < as_timestamp(today_at(earliest_close_time)) %}{% set due = false %}{% endif %}
    {% if should_use_latest_close and now_ts >= as_timestamp(today_at(latest_close_time)) %}{% set due = true %}{% endif %}
    {{ due }}

  # What this instance last committed to commanding — read back from its own
  # published intent, so the intent is the single record instead of a second
  # bookkeeping key. Absent (never run, or wiped) reads as -1, an impossible
  # position, which forces a transition on the first evaluation and drives the
  # covers to the correct phase instead of assuming where they are.
  my_intent: >
    {{ (state_attr('sensor.smarli_automation_tracker', 'data') or {})
       .get('shared', {}).get(instance_id ~ '::intent', {}) }}
  last_commanded: >
    {% set vals = my_intent.get('targets', {}).values() | list %}
    {{ vals[0] | int(-1) if vals | count > 0 else -1 }}
  # Suspension length this instance asks for, in seconds; 0 when the technician
  # turned suspension off. The resolver-side helper takes the MAX across all
  # contributors naming a cover, so this is a request, not a decision.
  suspension_seconds: >
    {{ 0 if not should_suspend_after_manual_interaction
       else (suspension_duration | as_timedelta).total_seconds() }}

  # Where the covers should be now. Closing wins over opening in the evening
  # overlap; outside both phases we hold whatever we last commanded.
  desired_position: >
    {% if schedule_wants_closed %}{{ position_closed }}
    {% elif schedule_wants_open %}{{ position_open }}
    {% else %}{{ last_commanded }}{% endif %}

  # Only act when the desired position actually changed since our last command.
  transition_needed: "{{ desired_position | int != last_commanded | int }}"

  # Every cover gets the same target this run. (No `zip` filter in HA Jinja —
  # build the dict with the same items()|list+[(k,v)] idiom used in smarli_core.)
  desired_targets: >
    {% set ns = namespace(d={}) %}
    {% for c in cover_entities %}
      {% set ns.d = dict(ns.d.items() | list + [(c, desired_position | int)]) %}
    {% endfor %}
    {{ ns.d }}

  # This instance's declaration to the resolver: a TARGET for every cover, never
  # a bound. Day-night says "move to X now"; it never constrains other families.
  intent_payload: >
    {{ {'targets': desired_targets, 'bounds': {}, 'priority': 10,
        'ts': now_ts | float(0), 'suspension_duration': suspension_seconds | float(0)} }}

############
# Triggers #
############
triggers:
  - alias: Evaluate once per minute
    trigger: time_pattern
    minutes: "/1"
    id: heartbeat
  - alias: Evaluate after automations are (re)loaded
    trigger: event
    event_type: automation_reloaded
    id: heartbeat
  - alias: Evaluate after Home Assistant starts
    trigger: homeassistant
    event: start
    id: heartbeat
  - alias: Cover state changed (manual detection)
    trigger: state
    entity_id: !input cover_entity
    # not_from/not_to (rather than no from/to) means real state transitions only —
    # no firing on every position attribute tick, and none on availability flaps.
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: cover_state_changed
  # Merge optional custom triggers (nested-trigger-list syntax; needs HA 2024.10+).
  - triggers: !input custom_opening_triggers
  - triggers: !input custom_closing_triggers

##############
# Conditions #
##############
# Gate the heartbeat: only run when there is actual work. This keeps the
# logbook and traces clean (condition-failed runs are not logged).
conditions:
  - condition: template
    value_template: >
      {{ trigger.id | default('') != 'heartbeat'
         or transition_needed or stabilizer_needs_update }}

###########
# Actions #
###########
actions:
  - choose:
      ######
      # Manual detection: classify the state change centrally
      ######
      - alias: A cover changed state — check whether it was manual
        conditions:
          - condition: trigger
            id: cover_state_changed
        sequence:
          - condition: template
            value_template: "{{ should_suspend_after_manual_interaction and trigger.to_state is not none }}"
          - action: script.smarli_cover_manual_check
            data:
              entity_id: "{{ trigger.entity_id }}"
              user_id: "{{ trigger.to_state.context.user_id | default('') }}"
              parent_id: "{{ trigger.to_state.context.parent_id | default('') }}"
              suspension_duration: "{{ suspension_duration }}"
    default:
      ######
      # Heartbeat / custom triggers: bookkeeping, then act on transitions
      ######
      - alias: Brightness stabilizer bookkeeping
        # Record when a threshold is first crossed / clear it when it's no longer
        # crossed. schedule_wants_* then requires the timestamp to be old enough.
        if:
          - condition: template
            value_template: "{{ stabilizer_needs_update }}"
        then:
          - if:
              - condition: template
                value_template: "{{ bright_enough_to_open and bright_since is none }}"
            then:
              - event: smarli_tracker_set
                event_data:
                  namespace: cover_day_night
                  key: "{{ instance_id }}::bright_since"
                  value: "{{ now_ts }}"
          - if:
              - condition: template
                value_template: "{{ not bright_enough_to_open and bright_since is not none }}"
            then:
              - event: smarli_tracker_remove
                event_data:
                  namespace: cover_day_night
                  key: "{{ instance_id }}::bright_since"
          - if:
              - condition: template
                value_template: "{{ dark_enough_to_close and dark_since is none }}"
            then:
              - event: smarli_tracker_set
                event_data:
                  namespace: cover_day_night
                  key: "{{ instance_id }}::dark_since"
                  value: "{{ now_ts }}"
          - if:
              - condition: template
                value_template: "{{ not dark_enough_to_close and dark_since is not none }}"
            then:
              - event: smarli_tracker_remove
                event_data:
                  namespace: cover_day_night
                  key: "{{ instance_id }}::dark_since"

      - alias: Open — reached the day phase (or a custom opening trigger fired)
        if:
          - condition: template
            value_template: >
              {{ trigger.id | default('') == 'custom_open'
                 or (trigger.id | default('') == 'heartbeat'
                     and transition_needed and desired_position | int == position_open) }}
        then:
          - alias: Custom opening conditions must pass
            condition: and
            conditions: !input custom_opening_conditions
          - alias: Publish this instance's intent (the resolver arbitrates it against every other contributor)
            event: smarli_tracker_set
            event_data:
              namespace: shared
              key: "{{ instance_id }}::intent"
              value: "{{ intent_payload }}"
          - alias: Resolve and move whatever changed
            # Called blocking: resolution is milliseconds and never waits for
            # travel (it fires the mover non-blocking), and blocking keeps the
            # publish-then-resolve order deterministic.
            action: script.smarli_cover_resolve
            data:
              owner: "{{ instance_id }}"
              intent: "{{ intent_payload }}"
          - alias: Run custom opening actions
            sequence: !input custom_opening_actions

      - alias: Close — reached the night phase (or a custom closing trigger fired)
        if:
          - condition: template
            value_template: >
              {{ trigger.id | default('') == 'custom_close'
                 or (trigger.id | default('') == 'heartbeat'
                     and transition_needed and desired_position | int == position_closed) }}
        then:
          - alias: Custom closing conditions must pass
            condition: and
            conditions: !input custom_closing_conditions
          - alias: Don't close if the weather is bad right now (retry next minute)
            if:
              - condition: template
                value_template: "{{ weather_blocked_now }}"
            then:
              - stop: "Closing blocked by current weather conditions"
          - alias: Don't close if bad weather is forecast within the hour (retry next minute)
            # supported_features bit 2 = FORECAST_HOURLY; skip (don't error) if unsupported.
            if:
              - condition: template
                value_template: >
                  {{ weather_entity != '' and weather_events | count > 0
                     and state_attr(weather_entity, 'supported_features') | int(0) | bitwise_and(2) > 0 }}
            then:
              - action: weather.get_forecasts
                # Templated (not `!input`) so config validation passes when no
                # weather entity is set — a bare entity_id:'' fails schema check
                # even though this branch is runtime-guarded on weather_entity!=''.
                target:
                  entity_id: "{{ weather_entity }}"
                data:
                  type: hourly
                response_variable: forecast_response
              - if:
                  - condition: template
                    # Check every entry whose hour overlaps the next 60 minutes, not just
                    # forecast[0]: some integrations (e.g. MeteoSchweiz) start the list
                    # with the current hour, so [0] alone would look ~0 min ahead at
                    # xx:59. Forecast wind_speed is in the entity's wind_speed_unit.
                    value_template: >
                      {% set ns = namespace(hit=false) %}
                      {% set f = wind_unit_to_kmh.get(state_attr(weather_entity, 'wind_speed_unit')) %}
                      {% for e in forecast_response.get(weather_entity, {}).get('forecast') or [] %}
                        {% set t = as_timestamp(e.get('datetime'), none) %}
                        {% if t is not none and t > now_ts | float(0) - 3600 and t <= now_ts | float(0) + 3600 %}
                          {% set w = e.get('wind_speed') %}
                          {% if e.get('condition', '') in weather_events
                                or (wind_events_selected and f is not none and w is number
                                    and w * f >= wind_speed_limit | float(0)) %}
                            {% set ns.hit = true %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.hit }}
                then:
                  - stop: "Closing blocked by weather forecast"
          - alias: Publish this instance's intent (the resolver arbitrates it against every other contributor)
            event: smarli_tracker_set
            event_data:
              namespace: shared
              key: "{{ instance_id }}::intent"
              value: "{{ intent_payload }}"
          - alias: Resolve and move whatever changed
            # Called blocking: resolution is milliseconds and never waits for
            # travel (it fires the mover non-blocking), and blocking keeps the
            # publish-then-resolve order deterministic.
            action: script.smarli_cover_resolve
            data:
              owner: "{{ instance_id }}"
              intent: "{{ intent_payload }}"
          - alias: Run custom closing actions
            sequence: !input custom_closing_actions

mode: queued
max: 35
max_exceeded: silent
