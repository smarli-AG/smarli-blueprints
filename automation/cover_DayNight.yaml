blueprint:
  ############
  # Metadata #
  ############
  name: smarli. Cover Control Day-Night-Cycle
  description: >
    # 🌞 smarli. Cover Control Day-Night-Cycle

    Open and close your covers automatically, based on sunrise/sunset, a fixed
    time or brightness.

    The automation opens your covers in the morning and closes them at night.
    Choose one of three methods: sunrise/sunset (including offsets), a fixed
    time, or a brightness sensor.

    You can set earliest and latest times, so the covers never move too early or
    too late. If desired, bad weather prevents the covers from extending to
    prevent damage. The automation closes them as soon as the weather clears.

    If somebody operates a cover by hand, the automation leaves that cover alone
    for a set duration. All other covers keep working as usual.

    *Version 3.1.0*

    <details>
    <summary><b>How to set it up</b></summary>

      1. Choose the method for the day-night cycle (sunrise/sunset, time or brightness).

      2. Configure the settings for the method you chose.

      3. (Optional) Set the earliest and latest times for opening and closing.

      4. Choose whether manual operation suspends the automation, and for how long.

      5. (Optional) Choose the weather events that prevent the covers from extending.

      6. Select the covers that should be automated.

      7. Add additional triggers, conditions, or actions manually - this is for experienced users only.
    </details>

    <details>
    <summary><b>How it works</b></summary>

      The automation evaluates the desired cover state (open/closed) once per
      minute and only acts when the desired state changes (or a custom trigger
      fires). This makes it robust against restarts: a transition missed during
      downtime is caught up on the next evaluation.

      Manual interventions are detected centrally (see requirements) and
      suspend the affected cover — other covers keep automating. After the
      suspension expires, the cover rejoins at the next scheduled transition.

      Several smarli. cover automations can control the same cover. Each one
      publishes what it wants to a central resolver, which combines all of them
      into one position per cover — so a shading automation and this one no
      longer fight over the same blind.

    </details>

    <details>
    <summary><b>Requirements</b></summary>

      This blueprint requires the **smarli. Core** and **smarli. Cover**
      packages (included in the Grundinstanz):
      `sensor.smarli_automation_tracker` (Core),
      `script.smarli_cover_manual_check` and `script.smarli_cover_resolve` (Cover).
      To retrofit an older instance, copy both `packages/smarli_core.yaml` and
      `packages/smarli_cover.yaml` from the `smarli-AG/ha-packages` repository
      into `config/packages/`.

    </details>

    <details>
    <summary><b>Known limitations</b></summary>

      - For reliable manual-operation detection, select the individual covers
        rather than cover groups (groups are expanded for actions, but manual
        detection on group members is not reliable).
      - Manual operation is detected via cover state transitions (opening/closing/
        open/closed). A cover whose integration changes position without ever
        reporting an opening/closing state cannot be detected as manual.
      - Weather forecast blocking checks the next hourly forecast entry, and only
        if the weather entity supports hourly forecasts (otherwise only current
        conditions block extending).

    </details>


    All input fields are required unless they are marked as ` (optional) `.
  domain: automation
  author: loocd [smarli. AG]
  source_url: https://github.com/smarli-AG/smarli-blueprints/blob/main/automation/cover_DayNight.yaml
  homeassistant:
    min_version: 2024.10.0

  ###############
  # User Inputs #
  ###############
  input:
    trigger_inputs:
      name: Trigger Inputs
      icon: mdi:star-box-multiple
      description: These inputs are used to set the automation triggers
      input:
        daynight_cycle_method:
          # translation:
          #   name:
          #     en: Day-Night-Cycle Method
          #     de: Methode für den Tag-Nacht-Zyklus
          #   description:
          #     en: Which method should control the day-night cycle? The covers open in the morning and close at night.
          #     de: Welche Methode soll den Tag-Nacht-Zyklus steuern? Die Storen öffnen am Morgen und schliessen am Abend.
          # optional: false
          # display_if: true
          name: Day-Night-Cycle Method
          description: >
            Based on which method should the day-night cycle (opening covers in the morning, closing them at night) operate?
          selector:
            select:
              options:
                - label: Sunrise/Sunset
                  # translation:
                  #   label:
                  #     en: Sunrise/Sunset
                  #     de: Sonnenaufgang/Sonnenuntergang
                  value: sun
                - label: Time
                  # translation:
                  #   label:
                  #     en: Time
                  #     de: Uhrzeit
                  value: time
                - label: Brightness
                  # translation:
                  #   label:
                  #     en: Brightness
                  #     de: Helligkeit
                  value: brightness
          default: sun

        workday_tracker:
          # translation:
          #   name:
          #     en: Workday Tracker
          #     de: Arbeitstag-Sensor
          #   description:
          #     en: Entity that tracks whether today is a workday. Use it to set different opening times on workdays and non-workdays. If it is not set, every day counts as a non-workday.
          #     de: Entität, die erfasst, ob heute ein Arbeitstag ist. Damit kannst Du unterschiedliche Öffnungszeiten für Arbeitstage und arbeitsfreie Tage festlegen. Ohne diese Angabe gilt jeder Tag als arbeitsfreier Tag.
          # optional: true
          # display_if: false
          name: Workday Tracker (optional)
          description: >
            Entity used to track whether or not today is a workday. This can be used to differentiate between opening times on workdays vs non-workdays.

            If this is not set, all days will be considered as non-workdays.
          selector:
            entity:
              filter:
                - domain: binary_sensor
          default: binary_sensor.workday_sensor
        workday_tomorrow_tracker:
          # translation:
          #   name:
          #     en: Workday Tomorrow Tracker
          #     de: Arbeitstag-Sensor für morgen
          #   description:
          #     en: Entity that tracks whether tomorrow is a workday. Use it to set different closing times depending on tomorrow. If it is not set, every day counts as a non-workday.
          #     de: Entität, die erfasst, ob morgen ein Arbeitstag ist. Damit kannst Du unterschiedliche Schliesszeiten je nach morgigem Tag festlegen. Ohne diese Angabe gilt jeder Tag als arbeitsfreier Tag.
          # optional: true
          # display_if: false
          name: Workday Tomorrow Tracker (optional)
          description: >
            Entity used to track whether or not tomorrow is a workday. This can be used to differentiate between closing times if tomorrow is a workday vs a non-workday.

            If this is not set, all days will be considered as non-workdays.
          selector:
            entity:
              filter:
                - domain: binary_sensor
          default: binary_sensor.workday_tomorrow_sensor

        sunrise_offset:
          # translation:
          #   name:
          #     en: Sunrise Offset
          #     de: Verschiebung Sonnenaufgang
          #   description:
          #     en: Shift the opening away from the actual sunrise. Use a negative value to open before sunrise. The sun integration supplies the sunrise time.
          #     de: Verschiebe das Öffnen gegenüber dem tatsächlichen Sonnenaufgang. Ein negativer Wert öffnet vor dem Sonnenaufgang. Die Sonnenaufgangszeit liefert die Sun-Integration.
          # optional: true
          # display_if: daynight_cycle_method == 'sun'
          name: Sunrise Offset (optional)
          description: If required, offset the opening from the actual sunrise time. Time of sunrise is delivered by the sun integration.
          selector:
            number:
              min: -120
              max: 120
              unit_of_measurement: minutes
          default: 0
        sunrise_offset_helper:
          # translation:
          #   name:
          #     en: Sunrise Offset Helper
          #     de: Helfer Verschiebung Sonnenaufgang
          #   description:
          #     en: Instead of setting the sunrise offset in this automation, use a number helper (minutes).
          #     de: Statt die Verschiebung in dieser Automation zu setzen, kannst Du einen Number-Helfer (Minuten) verwenden.
          # optional: true
          # display_if: false
          name: Sunrise Offset Helper (optional)
          description: Instead of setting a sunrise offset within this automation, you can use a number helper (minutes) to set the sunrise offset.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        sunset_offset:
          # translation:
          #   name:
          #     en: Sunset Offset
          #     de: Verschiebung Sonnenuntergang
          #   description:
          #     en: Shift the closing away from the actual sunset. Use a negative value to close before sunset. The sun integration supplies the sunset time.
          #     de: Verschiebe das Schliessen gegenüber dem tatsächlichen Sonnenuntergang. Ein negativer Wert schliesst vor dem Sonnenuntergang. Die Sonnenuntergangszeit liefert die Sun-Integration.
          # optional: true
          # display_if: daynight_cycle_method == 'sun'
          name: Sunset Offset (optional)
          description: If required, offset the closing from the actual sunset time. Time of sunset is delivered by the sun integration.
          selector:
            number:
              min: -120
              max: 120
              unit_of_measurement: minutes
          default: 0
        sunset_offset_helper:
          # translation:
          #   name:
          #     en: Sunset Offset Helper
          #     de: Helfer Verschiebung Sonnenuntergang
          #   description:
          #     en: Instead of setting the sunset offset in this automation, use a number helper (minutes).
          #     de: Statt die Verschiebung in dieser Automation zu setzen, kannst Du einen Number-Helfer (Minuten) verwenden.
          # optional: true
          # display_if: false
          name: Sunset Offset Helper (optional)
          description: Instead of setting a sunset offset within this automation, you can use a number helper (minutes) to set the sunset offset.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        time_open_workday:
          # translation:
          #   name:
          #     en: Open Time on Workdays
          #     de: Öffnungszeit an Arbeitstagen
          #   description:
          #     en: At what time should the covers open on workdays?
          #     de: Um welche Uhrzeit sollen die Storen an Arbeitstagen öffnen?
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Open Time on Workdays (optional)
          description: Time to open covers on workdays, if `Day-Night-Cycle Method` is set to `Time`.
          selector:
            time:
          default: "06:00:00"
        time_open_workday_helper:
          # translation:
          #   name:
          #     en: Open Time on Workdays Helper
          #     de: Helfer Öffnungszeit an Arbeitstagen
          #   description:
          #     en: Instead of setting the opening time in this automation, use a datetime helper (time only).
          #     de: Statt die Öffnungszeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Open Time on Workdays Helper (optional)
          description: Instead of setting the opening time within this automation, you can use a datetime helper (time only) to set the open time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""
        time_open_non_workday:
          # translation:
          #   name:
          #     en: Open Time on Non-Workdays
          #     de: Öffnungszeit an arbeitsfreien Tagen
          #   description:
          #     en: At what time should the covers open on non-workdays?
          #     de: Um welche Uhrzeit sollen die Storen an arbeitsfreien Tagen öffnen?
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Open Time on Non-Workdays (optional)
          description: Time to open covers on non-workdays, if `Day-Night-Cycle Method` is set to `Time`.
          selector:
            time:
          default: "07:00:00"
        time_open_non_workday_helper:
          # translation:
          #   name:
          #     en: Open Time on Non-Workdays Helper
          #     de: Helfer Öffnungszeit an arbeitsfreien Tagen
          #   description:
          #     en: Instead of setting the opening time in this automation, use a datetime helper (time only).
          #     de: Statt die Öffnungszeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Open Time on Non-Workdays Helper (optional)
          description: Instead of setting the opening time within this automation, you can use a datetime helper (time only) to set the open time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""

        time_close_workday_tomorrow:
          # translation:
          #   name:
          #     en: Close Time if Tomorrow is a Workday
          #     de: Schliesszeit wenn morgen ein Arbeitstag ist
          #   description:
          #     en: At what time should the covers close if tomorrow is a workday?
          #     de: Um welche Uhrzeit sollen die Storen schliessen, wenn morgen ein Arbeitstag ist?
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Close Time if tomorrow is a Workday (optional)
          description: Time to close covers if tomorrow is a workday, if `Day-Night-Cycle Method` is set to `Time`.
          selector:
            time:
          default: "21:00:00"
        time_close_workday_tomorrow_helper:
          # translation:
          #   name:
          #     en: Close Time if Tomorrow is a Workday Helper
          #     de: Helfer Schliesszeit wenn morgen ein Arbeitstag ist
          #   description:
          #     en: Instead of setting the closing time in this automation, use a datetime helper (time only).
          #     de: Statt die Schliesszeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Close Time if Tomorrow is a Workday Helper (optional)
          description: Instead of setting the closing time within this automation, you can use a datetime helper (time only) to set the close time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""
        time_close_non_workday_tomorrow:
          # translation:
          #   name:
          #     en: Close Time if Tomorrow is not a Workday
          #     de: Schliesszeit wenn morgen kein Arbeitstag ist
          #   description:
          #     en: At what time should the covers close if tomorrow is not a workday?
          #     de: Um welche Uhrzeit sollen die Storen schliessen, wenn morgen kein Arbeitstag ist?
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Close Time if tomorrow is not a Workday (optional)
          description: Time to close covers if tomorrow is not a workday, if `Day-Night Cycle Method` is set to `Time`.
          selector:
            time:
          default: "21:00:00"
        time_close_non_workday_tomorrow_helper:
          # translation:
          #   name:
          #     en: Close Time if Tomorrow is not a Workday Helper
          #     de: Helfer Schliesszeit wenn morgen kein Arbeitstag ist
          #   description:
          #     en: Instead of setting the closing time in this automation, use a datetime helper (time only).
          #     de: Statt die Schliesszeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Close Time if Tomorrow is not a Workday Helper (optional)
          description: Instead of setting the closing time within this automation, you can use a datetime helper (time only) to set the close time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""

        brightness_sensor:
          # translation:
          #   name:
          #     en: Brightness Sensor
          #     de: Helligkeitssensor
          #   description:
          #     en: Which brightness sensor should the automation read? Without this sensor the brightness method cannot work.
          #     de: Welchen Helligkeitssensor soll die Automation auslesen? Ohne diesen Sensor funktioniert die Helligkeits-Methode nicht.
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness Sensor
          description: Brightness sensor entity. Required if `Day-Night-Cycle Method` is set to `Brightness`.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
          default: ""
        lux_sensor_delay:
          # translation:
          #   name:
          #     en: Brightness Sensor Stabilizer
          #     de: Verzögerung Helligkeitssensor
          #   description:
          #     en: How long must the sensor stay above or below the threshold before the covers move? This prevents constant back-and-forth, for example when a cloud passes in front of the sun.
          #     de: Wie lange muss der Sensor über oder unter dem Schwellenwert bleiben, bevor die Storen fahren? Das verhindert ständiges Hin und Her, zum Beispiel wenn eine Wolke vor die Sonne zieht.
          # optional: true
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness Sensor Stabilizer (optional)
          description: How long does the brightness sensor need to be above/below the defined threshold before the covers move? This avoids frequent back-and-forth switching (e.g. if a cloud passes in front of the sun).
          selector:
            time:
          default: "00:15:00"

        brightness_open:
          # translation:
          #   name:
          #     en: Brightness to Open
          #     de: Helligkeit zum Öffnen
          #   description:
          #     en: At which brightness level should the covers open?
          #     de: Ab welcher Helligkeit sollen die Storen öffnen?
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness to Open (optional)
          description: Brightness level to open covers, if `Day-Night Cycle Method` is set to `Brightness`.
          selector:
            number:
              min: 0
              max: 100000
              unit_of_measurement: lux
              mode: box
          default: 500
        brightness_open_helper:
          # translation:
          #   name:
          #     en: Brightness Open Helper
          #     de: Helfer Helligkeit zum Öffnen
          #   description:
          #     en: Instead of setting the brightness to open in this automation, use a number helper.
          #     de: Statt die Helligkeit zum Öffnen in dieser Automation zu setzen, kannst Du einen Number-Helfer verwenden.
          # optional: true
          # display_if: false
          name: Brightness Open Helper (optional)
          description: Instead of setting the brightness to open within this automation, you can use a number helper to set the brightness to open.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        brightness_close:
          # translation:
          #   name:
          #     en: Brightness to Close
          #     de: Helligkeit zum Schliessen
          #   description:
          #     en: At which brightness level should the covers close? This value must be lower than the brightness to open.
          #     de: Ab welcher Helligkeit sollen die Storen schliessen? Dieser Wert muss tiefer sein als die Helligkeit zum Öffnen.
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness to Close (optional)
          description: Brightness level to close covers, if `Day-Night Cycle Method` is set to `Brightness`. Must be below `Brightness to Open` (hysteresis).
          selector:
            number:
              min: 0
              max: 100000
              unit_of_measurement: lux
              mode: box
          default: 30
        brightness_close_helper:
          # translation:
          #   name:
          #     en: Brightness Close Helper
          #     de: Helfer Helligkeit zum Schliessen
          #   description:
          #     en: Instead of setting the brightness to close in this automation, use a number helper.
          #     de: Statt die Helligkeit zum Schliessen in dieser Automation zu setzen, kannst Du einen Number-Helfer verwenden.
          # optional: true
          # display_if: false
          name: Brightness Close Helper (optional)
          description: Instead of setting the brightness to close within this automation, you can use a number helper to set the brightness to close.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        should_use_earliest_open:
          # translation:
          #   name:
          #     en: Use Earliest Open Time
          #     de: Früheste Öffnungszeit verwenden
          #   description:
          #     en: Do you want to set a time before which the covers must not open? The covers stay closed until that time, even if the chosen method already wants to open them.
          #     de: Möchtest Du eine Zeit festlegen, vor der die Storen nicht öffnen dürfen? Die Storen bleiben bis zu dieser Zeit geschlossen, auch wenn die gewählte Methode bereits öffnen möchte.
          # optional: false
          # display_if: true
          name: Use Earliest Open Time
          description: >
            Do you want to set a time at which the covers should open at the earliest?

            The covers will not open before the time you set, even if the chosen method has
            already reached its opening point. They open once the earliest time is reached.
          selector:
            boolean:
          default: false
        earliest_open_workday:
          # translation:
          #   name:
          #     en: Earliest Open Time on Workdays
          #     de: Früheste Öffnungszeit an Arbeitstagen
          #   description:
          #     en: Before this time, the covers do not open on workdays.
          #     de: Vor dieser Zeit öffnen die Storen an Arbeitstagen nicht.
          # optional: false
          # display_if: should_use_earliest_open == true
          name: Earliest Open Time on Workdays (optional)
          description: Earliest time to open covers on workdays. Only relevant if `Use Earliest Open Time` is set to `true`.
          selector:
            time:
          default: "07:00:00"
        earliest_open_workday_helper:
          # translation:
          #   name:
          #     en: Earliest Open Time Workday Helper
