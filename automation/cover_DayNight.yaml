blueprint:
  ############
  # Metadata #
  ############
  name: smarli. Cover Control Day-Night-Cycle
  description: >
    # 🌞 smarli. Cover Control Day-Night-Cycle

    Retract and extend your covers automatically, based on sunrise/sunset, a fixed
    time or brightness.

    The automation retracts your covers in the morning and extends them at night.
    Choose one of three methods: sunrise/sunset (including offsets), a fixed
    time, or a brightness sensor.

    **Supported cover types: shutters, blinds, shades and curtains** (device class
    `shutter`, `blind`, `shade` or `curtain`). Awnings and windows are not
    supported and cannot be selected.

    You can set earliest and latest times, so the covers never move too early or
    too late. If desired, bad weather prevents the covers from extending to
    prevent damage. The automation extends them as soon as the weather clears.

    If somebody operates a cover by hand, the automation leaves that cover alone
    for a set duration. All other covers keep working as usual.

    *Version 3.1.0*

    <details>
    <summary><b>How to set it up</b></summary>

      1. Choose the method for the day-night cycle (sunrise/sunset, time or brightness).

      2. Configure the settings for the method you chose.

      3. (Optional) Set the earliest and latest times for retracting and extending.

      4. Choose whether manual operation suspends the automation, and for how long.

      5. (Optional) Choose the weather events that prevent the covers from extending.

      6. Select the covers that should be automated.

      7. Add additional triggers, conditions, or actions manually - this is for experienced users only.
    </details>

    <details>
    <summary><b>How it works</b></summary>

      The automation evaluates the desired cover state (retracted/extended) once per
      minute and only acts when the desired state changes (or a custom trigger
      fires). This makes it robust against restarts: a transition missed during
      downtime is caught up on the next evaluation.

      Manual interventions are detected centrally (see requirements) and
      suspend the affected cover — other covers keep automating. After the
      suspension expires, the cover rejoins at the next scheduled transition.

      Several smarli. cover automations can control the same cover. Each one
      publishes what it wants to a central resolver, which combines all of them
      into one position per cover — so a shading automation and this one no
      longer fight over the same blind.

    </details>

    <details>
    <summary><b>Requirements</b></summary>

      This blueprint requires the **smarli. Core** and **smarli. Cover**
      packages (included in the Grundinstanz):
      `sensor.smarli_automation_tracker` (Core),
      `script.smarli_cover_manual_check` and `script.smarli_cover_resolve` (Cover).
      To retrofit an older instance, copy both `packages/smarli_core.yaml` and
      `packages/smarli_cover.yaml` from the `smarli-AG/ha-packages` repository
      into `config/packages/`.

    </details>

    <details>
    <summary><b>Known limitations</b></summary>

      - For reliable manual-operation detection, select the individual covers
        rather than cover groups (groups are expanded for actions, but manual
        detection on group members is not reliable).
      - Manual operation is detected via cover state transitions (opening/closing/
        open/closed). A cover whose integration changes position without ever
        reporting an opening/closing state cannot be detected as manual.
      - Weather forecast blocking checks the hourly forecast entries for the current
        and the next hour, and only if the weather entity supports hourly forecasts
        (otherwise only current conditions block extending).
      - Without a wind sensor, the wind speed comes from the weather entity. That
        is a forecast model, not a measurement on site.

    </details>


    All input fields are required unless they are marked as ` (optional) `.
  domain: automation
  author: loocd [smarli. AG]
  source_url: https://github.com/smarli-AG/smarli-blueprints/blob/main/automation/cover_DayNight.yaml
  homeassistant:
    min_version: 2024.10.0

  ###############
  # User Inputs #
  ###############
  input:
    trigger_inputs:
      name: Trigger Inputs
      icon: mdi:star-box-multiple
      description: These inputs are used to set the automation triggers
      input:
        daynight_cycle_method:
          # translation:
          #   name:
          #     en: Day-Night-Cycle Method
          #     de: Methode für den Tag-Nacht-Zyklus
          #   description:
          #     en: Which method should control the day-night cycle? The covers retract in the morning and extend at night.
          #     de: Welche Methode soll den Tag-Nacht-Zyklus steuern? Die Storen fahren am Morgen ein und am Abend aus.
          # optional: false
          # display_if: true
          name: Day-Night-Cycle Method
          description: >
            Based on which method should the day-night cycle (retracting covers in the morning, extending them at night) operate?
          selector:
            select:
              options:
                - label: Sunrise/Sunset
                  # translation:
                  #   label:
                  #     en: Sunrise/Sunset
                  #     de: Sonnenaufgang/Sonnenuntergang
                  value: sun
                - label: Time
                  # translation:
                  #   label:
                  #     en: Time
                  #     de: Uhrzeit
                  value: time
                - label: Brightness
                  # translation:
                  #   label:
                  #     en: Brightness
                  #     de: Helligkeit
                  value: brightness
          default: sun

        sunrise_offset:
          # translation:
          #   name:
          #     en: Sunrise Offset
          #     de: Offset Sonnenaufgang
          #   description:
          #     en: Shift the retraction away from the actual sunrise. Use a negative value to retract before sunrise.
          #     de: Verschiebe das Einfahren gegenüber dem tatsächlichen Sonnenaufgang. Ein negativer Wert fährt die Storen vor Sonnenaufgang ein.
          # optional: true
          # display_if: daynight_cycle_method == 'sun'
          name: Sunrise Offset (optional)
          description: If required, offset the retraction from the actual sunrise time. Time of sunrise is delivered by the sun integration.
          selector:
            number:
              min: -120
              max: 120
              step: 15
              unit_of_measurement: minutes
          default: 0
        sunrise_offset_helper:
          # translation:
          #   name:
          #     en: Sunrise Offset Helper
          #     de: Helfer Offset Sonnenaufgang
          #   description:
          #     en: Instead of setting the sunrise offset in this automation, use a number helper (minutes).
          #     de: Statt den Offset in dieser Automation zu setzen, kannst Du einen Number-Helfer (Minuten) verwenden.
          # optional: true
          # display_if: false
          name: Sunrise Offset Helper (optional)
          description: Instead of setting a sunrise offset within this automation, you can use a number helper (minutes) to set the sunrise offset.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        sunset_offset:
          # translation:
          #   name:
          #     en: Sunset Offset
          #     de: Offset Sonnenuntergang
          #   description:
          #     en: Shift the extension away from the actual sunset. Use a negative value to extend before sunset.
          #     de: Verschiebe das Ausfahren gegenüber dem tatsächlichen Sonnenuntergang. Ein negativer Wert fährt die Storen vor dem Sonnenuntergang aus.
          # optional: true
          # display_if: daynight_cycle_method == 'sun'
          name: Sunset Offset (optional)
          description: If required, offset the extension from the actual sunset time. Time of sunset is delivered by the sun integration.
          selector:
            number:
              min: -120
              max: 120
              step: 15
              unit_of_measurement: minutes
          default: 0
        sunset_offset_helper:
          # translation:
          #   name:
          #     en: Sunset Offset Helper
          #     de: Helfer Offset Sonnenuntergang
          #   description:
          #     en: Instead of setting the sunset offset in this automation, use a number helper (minutes).
          #     de: Statt den Offset in dieser Automation zu setzen, kannst Du einen Number-Helfer (Minuten) verwenden.
          # optional: true
          # display_if: false
          name: Sunset Offset Helper (optional)
          description: Instead of setting a sunset offset within this automation, you can use a number helper (minutes) to set the sunset offset.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        time_open_workday:
          # translation:
          #   name:
          #     en: Retract Time on Workdays
          #     de: Einfahrzeit an Arbeitstagen
          #   description:
          #     en: At what time should the covers retract on workdays? Workdays follow the Swiss public holidays.
          #     de: Um welche Uhrzeit sollen die Storen an Arbeitstagen einfahren? Arbeitstage richten sich nach den Schweizer Feiertagen.
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Retract Time on Workdays (optional)
          description: Time to retract covers on workdays, if `Day-Night-Cycle Method` is set to `Time`. Workdays follow the Swiss public holidays.
          selector:
            time:
          default: "06:00:00"
        time_open_workday_helper:
          # translation:
          #   name:
          #     en: Retract Time on Workdays Helper
          #     de: Helfer Einfahrzeit an Arbeitstagen
          #   description:
          #     en: Instead of setting the retract time in this automation, use a datetime helper (time only).
          #     de: Statt die Einfahrzeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Retract Time on Workdays Helper (optional)
          description: Instead of setting the retract time within this automation, you can use a datetime helper (time only) to set the retract time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""
        time_open_non_workday:
          # translation:
          #   name:
          #     en: Retract Time on Non-Workdays
          #     de: Einfahrzeit an arbeitsfreien Tagen
          #   description:
          #     en: At what time should the covers retract on non-workdays? Workdays follow the Swiss public holidays.
          #     de: Um welche Uhrzeit sollen die Storen an arbeitsfreien Tagen einfahren? Arbeitstage richten sich nach den Schweizer Feiertagen.
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Retract Time on Non-Workdays (optional)
          description: Time to retract covers on non-workdays, if `Day-Night-Cycle Method` is set to `Time`. Workdays follow the Swiss public holidays.
          selector:
            time:
          default: "07:00:00"
        time_open_non_workday_helper:
          # translation:
          #   name:
          #     en: Retract Time on Non-Workdays Helper
          #     de: Helfer Einfahrzeit an arbeitsfreien Tagen
          #   description:
          #     en: Instead of setting the retract time in this automation, use a datetime helper (time only).
          #     de: Statt die Einfahrzeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Retract Time on Non-Workdays Helper (optional)
          description: Instead of setting the retract time within this automation, you can use a datetime helper (time only) to set the retract time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""

        time_close_workday_tomorrow:
          # translation:
          #   name:
          #     en: Extend Time Before Workdays
          #     de: Ausfahrzeit vor Arbeitstagen
          #   description:
          #     en: At what time should the covers extend if tomorrow is a workday? Workdays follow the Swiss public holidays.
          #     de: Um welche Uhrzeit sollen die Storen ausfahren, wenn morgen ein Arbeitstag ist? Arbeitstage richten sich nach den Schweizer Feiertagen.
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Extend Time Before Workdays (optional)
          description: Time to extend covers if tomorrow is a workday, if `Day-Night-Cycle Method` is set to `Time`. Workdays follow the Swiss public holidays.
          selector:
            time:
          default: "21:00:00"
        time_close_workday_tomorrow_helper:
          # translation:
          #   name:
          #     en: Extend Time Before Workdays Helper
          #     de: Helfer Ausfahrzeit vor Arbeitstagen
          #   description:
          #     en: Instead of setting the extend time in this automation, use a datetime helper (time only).
          #     de: Statt die Ausfahrzeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Extend Time Before Workdays Helper (optional)
          description: Instead of setting the extend time within this automation, you can use a datetime helper (time only) to set the extend time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""
        time_close_non_workday_tomorrow:
          # translation:
          #   name:
          #     en: Extend Time Before Non-Workdays
          #     de: Ausfahrzeit vor arbeitsfreien Tagen
          #   description:
          #     en: At what time should the covers extend if tomorrow is not a workday? Workdays follow the Swiss public holidays.
          #     de: Um welche Uhrzeit sollen die Storen ausfahren, wenn morgen kein Arbeitstag ist? Arbeitstage richten sich nach den Schweizer Feiertagen.
          # optional: false
          # display_if: daynight_cycle_method == 'time'
          name: Extend Time Before Non-Workdays (optional)
          description: Time to extend covers if tomorrow is not a workday, if `Day-Night Cycle Method` is set to `Time`. Workdays follow the Swiss public holidays.
          selector:
            time:
          default: "21:00:00"
        time_close_non_workday_tomorrow_helper:
          # translation:
          #   name:
          #     en: Extend Time Before Non-Workdays Helper
          #     de: Helfer Ausfahrzeit vor arbeitsfreien Tagen
          #   description:
          #     en: Instead of setting the extend time in this automation, use a datetime helper (time only).
          #     de: Statt die Ausfahrzeit in dieser Automation zu setzen, kannst Du einen Datetime-Helfer (nur Zeit) verwenden.
          # optional: true
          # display_if: false
          name: Extend Time Before Non-Workdays Helper (optional)
          description: Instead of setting the extend time within this automation, you can use a datetime helper (time only) to set the extend time.
          selector:
            entity:
              filter:
                - domain: input_datetime
          default: ""

        brightness_sensor:
          # translation:
          #   name:
          #     en: Brightness Sensor
          #     de: Helligkeitssensor
          #   description:
          #     en: Which brightness sensor should the automation read?
          #     de: Welchen Helligkeitssensor soll die Automation auslesen?
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness Sensor
          description: Brightness sensor entity. Required if `Day-Night-Cycle Method` is set to `Brightness`.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
          default: ""
        lux_sensor_delay:
          # translation:
          #   name:
          #     en: Brightness Sensor Stabilizer
          #     de: Verzögerung Helligkeitssensor
          #   description:
          #     en: How long must the sensor stay above or below the threshold before the covers move? This prevents constant back-and-forth, for example when a cloud passes in front of the sun.
          #     de: Wie lange muss der Sensor über oder unter dem Schwellenwert bleiben, bevor die Storen fahren? Das verhindert ständiges Hin und Her, zum Beispiel wenn eine Wolke vor die Sonne zieht.
          # optional: true
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness Sensor Stabilizer (optional)
          description: How long does the brightness sensor need to be above/below the defined threshold before the covers move? This avoids frequent back-and-forth switching (e.g. if a cloud passes in front of the sun).
          selector:
            time:
          default: "00:15:00"

        brightness_open:
          # translation:
          #   name:
          #     en: Brightness to Retract
          #     de: Helligkeit zum Einfahren
          #   description:
          #     en: At which brightness level should the covers retract?
          #     de: Ab welcher Helligkeit sollen die Storen einfahren?
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness to Retract (optional)
          description: Brightness level to retract covers, if `Day-Night Cycle Method` is set to `Brightness`.
          selector:
            number:
              min: 0
              max: 50000
              unit_of_measurement: lux
              mode: box
          default: 500
        brightness_open_helper:
          # translation:
          #   name:
          #     en: Brightness Retract Helper
          #     de: Helfer Helligkeit zum Einfahren
          #   description:
          #     en: Instead of setting the brightness to retract in this automation, use a number helper.
          #     de: Statt die Helligkeit zum Einfahren in dieser Automation zu setzen, kannst Du einen Number-Helfer verwenden.
          # optional: true
          # display_if: false
          name: Brightness Retract Helper (optional)
          description: Instead of setting the brightness to retract within this automation, you can use a number helper to set the brightness to retract.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        brightness_close:
          # translation:
          #   name:
          #     en: Brightness to Extend
          #     de: Helligkeit zum Ausfahren
          #   description:
          #     en: At which brightness level should the covers extend? This value must be lower than the brightness to retract.
          #     de: Ab welcher Helligkeit sollen die Storen ausfahren? Dieser Wert muss tiefer sein als die Helligkeit zum Einfahren.
          # optional: false
          # display_if: daynight_cycle_method == 'brightness'
          name: Brightness to Extend (optional)
          description: Brightness level to extend covers, if `Day-Night Cycle Method` is set to `Brightness`. Must be below `Brightness to Retract` (hysteresis).
          selector:
            number:
              min: 0
              max: 50000
              unit_of_measurement: lux
              mode: box
          default: 30
        brightness_close_helper:
          # translation:
          #   name:
          #     en: Brightness Extend Helper
          #     de: Helfer Helligkeit zum Ausfahren
          #   description:
          #     en: Instead of setting the brightness to extend in this automation, use a number helper.
          #     de: Statt die Helligkeit zum Ausfahren in dieser Automation zu setzen, kannst Du einen Number-Helfer verwenden.
          # optional: true
          # display_if: false
          name: Brightness Extend Helper (optional)
          description: Instead of setting the brightness to extend within this automation, you can use a number helper to set the brightness to extend.
          selector:
            entity:
              filter:
                - domain: input_number
          default: ""

        workday_tracker:
          # translation:
          #   name:
          #     en: Workday Tracker
          #     de: Arbeitstag-Sensor
          #   description:
          #     en: Entity that tracks whether today is a workday. Use it to set different retract times on workdays and non-workdays. It applies to the retract times above, and to the earliest and latest retract times below. If it is not set, every day counts as a non-workday.
          #     de: Entität, die erfasst, ob heute ein Arbeitstag ist. Damit kannst Du unterschiedliche Einfahrzeiten für Arbeitstage und arbeitsfreie Tage festlegen. Sie gilt für die Einfahrzeiten oben und für die früheste und späteste Einfahrzeit unten. Ohne diese Angabe gilt jeder Tag als arbeitsfreier Tag.
          # optional: true
          # display_if: false
          name: Workday Tracker (optional)
          description: >
            Entity used to track whether or not today is a workday. This can be used to differentiate between retract times on workdays vs non-workdays.
            It applies to the retract times above, and to the earliest and latest retract times below.

            If this is not set, all days will be considered as non-workdays.
          selector:
            entity:
              filter:
                - domain: binary_sensor
          default: binary_sensor.workday_sensor
        workday_tomorrow_tracker:
          # translation:
          #   name:
          #     en: Workday Tomorrow Tracker
          #     de: Arbeitstag-Sensor für morgen
          #   description:
          #     en: Entity that tracks whether tomorrow is a workday. Use it to set different extend times depending on tomorrow. It applies to the extend times above, and to the earliest and latest extend times below. If it is not set, every day counts as a non-workday.
          #     de: Entität, die erfasst, ob morgen ein Arbeitstag ist. Damit kannst Du unterschiedliche Ausfahrzeiten je nach morgigem Tag festlegen. Sie gilt für die Ausfahrzeiten oben und für die früheste und späteste Ausfahrzeit unten. Ohne diese Angabe gilt jeder Tag als arbeitsfreier Tag.
          # optional: true
          # display_if: false
          name: Workday Tomorrow Tracker (optional)
          description: >
            Entity used to track whether or not tomorrow is a workday. This can be used to differentiate between extend times if tomorrow is a workday vs a non-workday.
            It applies to the extend times above, and to the earliest and latest extend times below.

            If this is not set, all days will be considered as non-workdays.
          selector:
