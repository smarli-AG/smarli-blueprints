# ================
# Partner Engine
# ================
# is_smart_button: true
# icon: "palette"
#
# name_en: "Scene Activation"
# name_de: "Szene aktivieren"
# subtitle_en: "Philips hue Button"
# subtitle_de: "Philips hue Button"
#
# short_description_en: "Activate a scene with a single press of your Philips hue smart button."
# short_description_de: "Aktiviere eine Szene durch das einfache Drücken Deines Philips hue Smart Buttons."
# long_description_en: |
#   __Activate a scene with a single press of your Philips hue smart button.__
#   [br]
#   The Scene Activation automation lets you activate any scene in your home with the press of a button. This automation is made for the Philips hue smart button.
#   [br]
#   [br]
#   __How to set it up:__
#   1. Select the Philips hue button that should trigger the scene
#   2. Select the scene you want to activate
#   3. (Optional) Add a delay before the scene activates
#   [br]
#   ---
#   [br]
#   _Version 1.1.0_
# long_description_de: |
#   __Aktiviere eine Szene durch das einfache Drücken Deines Philips hue Smart Buttons.__
#   [br]
#   Die Automation zur Szenenaktivierung ermöglicht es Dir, jede Szene in Deinem Zuhause per Knopfdruck zu aktivieren. Diese Automatisierung ist für den Philips hue Button vorgesehen.
#   [br]
#   [br]
#   __Einrichtung der Automatisierung:__
#   1. Wähle den Philips hue Button aus, welcher die Szene auslösen soll
#   2. Wähle die Szene aus, die aktiviert werden soll
#   3. (Optional) Füge eine Verzögerung hinzu, bevor die Szene aktiviert wird
#   [br]
#   ---
#   [br]
#   _Version 1.1.0_
#
# purpose_en: "Comfort"
# purpose_de: "Komfort"
#
# keywords_en: [scene, button, activate, hue button]
# keywords_de: [szene, button, aktivieren, hue button]
# events_en: [button press]
# events_de: [Knopfdruck]
# highlight: false
# deploy: true

blueprint:
  ############
  # Metadata #
  ############
  name: smarli. Scene Activation with Philips hue button
  description: >
    # 🎨 smarli. Scene Activation with Philips hue button

    This automation will activate a selected scene when your Philips hue smart button is pressed.
    This automation uses scripts, not native Home Assistant scenes, under the hood. Scripts support more features than scenes. Select the script that represents your scene under "Scene to Activate".

    *Version 1.1.0*

    <details>
    <summary><b>How to set it up</b></summary>

      1. Select the Philips hue button that should trigger the scene
      2. Select the scene you want to activate
      3. (Optional) Add a delay before the scene activates
    </details>


    All input fields are required unless they are marked as ` (optional) `.
  domain: automation
  author: loocd [smarli. AG]
  source_url: https://github.com/smarli-AG/smarli-blueprints/blob/main/automation/activateSceneSmartButton_hueSmartButton.yaml
  homeassistant:
    min_version: 2024.10.0

  ###############
  # User Inputs #
  ###############
  input:
    trigger_inputs:
      name: Trigger Inputs
      icon: mdi:star-box-multiple
      description: These inputs are used to set the automation triggers
      input:
        smart_button:
          # translation:
          #   name:
          #     en: Philips hue Button
          #     de: Philips hue Button
          #   description:
          #     en: Select the Philips hue smart button that should activate the scene.
          #     de: Wähle den Philips hue Button, welcher die Szene aktivieren soll.
          # optional: false
          # display_if: true
          name: Philips hue Button
          description: Select the Philips hue smart button that should activate the scene.
          selector:
            device:
              filter:
                - integration: mqtt
                  manufacturer: Philips
                  model: Hue smart button
              multiple: false

    condition_inputs:
      name: Condition Inputs
      icon: mdi:help-box-multiple
      description: These inputs are used to set the automation conditions

    action_inputs:
      name: Action Inputs
      icon: mdi:play-box-multiple
      description: These inputs are used to set the actions
      input:
        scene_to_activate:
          # translation:
          #   name:
          #     en: Scene to Activate
          #     de: Zu aktivierende Szene
          #   description:
          #     en: Select the scene that should be activated when the button is pressed.
          #     de: Wähle die Szene aus, die aktiviert werden soll, wenn der Button gedrückt wird.
          # optional: false
          # display_if: true
          name: Scene to Activate
          description: Select the scene that should be activated when the button is pressed.
          selector:
            entity:
              filter:
                - domain: script
              multiple: false
        delay:
          # translation:
          #   name:
          #     en: Delay
          #     de: Verzögerung
          #   description:
          #     en: Add a delay before activating the scene.
          #     de: Füge eine Verzögerung hinzu, bevor die Szene aktiviert wird.
          # optional: true
          # display_if: true
          name: Delay (optional)
          description: Add a delay before activating the scene.
          selector:
            duration:
              enable_day: false
              enable_millisecond: false
          default: "00:00:00"

    custom_inputs: # leave these as is - should be present in any blueprint
      name: "DANGER ZONE: Additional Custom Inputs"
      icon: mdi:alert
      description: >-
        **WATCH OUT!**

        This is advanced functionality and should only be used if you know what you're doing!


        Use this section to define custom triggers and conditions, as well as actions that will run at the end of the automation.
      collapsed: true
      input:
        custom_triggers:
          name: Custom triggers (optional)
          description: >-
            Use this to define custom triggers in addition to the default triggers.
          selector:
            trigger:
          default: []
        custom_conditions:
          name: Custom conditions (optional)
          description: >-
            Use this to define custom conditions in addition to the default conditions.
          selector:
            condition:
          default: []
        custom_actions:
          name: Custom actions (optional)
          description: >-
            Use this to define custom actions that should be executed at the end of this automation.
          selector:
            action:
          default: []

#########################
# Variables Translation #
#########################

trigger_variables: {}

# this is required in order to use inputs as variables within templates
variables: {}

##############
# Automation #
##############

mode: single
max_exceeded: silent

triggers:
  - domain: mqtt
    device_id: !input smart_button
    type: action
    subtype: press
    trigger: device
  ## Custom triggers
  - triggers: !input custom_triggers

conditions: # by default, conditions follow an AND logic
  ## Custom conditions
  - condition: and
    conditions: !input custom_conditions

actions:
  - delay: !input delay
  - action: script.turn_on
    target:
      entity_id: !input scene_to_activate
  ## Custom actions
  - if:
      - condition: template
        value_template: "{{ custom_actions is not none }}"
    then: !input custom_actions
