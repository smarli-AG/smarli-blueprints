# ============================================================================
# smarli. Core Package
# ============================================================================
# Foundation required by ALL smarli. blueprints. Included in the Grundinstanz.
# Retrofit: copy this file to `config/packages/` (plus the feature package for
# each blueprint family in use, e.g. smarli_cover.yaml) and make sure packages
# are enabled in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Contents:
#   - sensor.smarli_automation_tracker  central key-value store for automation
#                                       state (survives restarts)
#   - recorder exclude for the tracker  every write snapshots the whole `data`
#                                       attribute into the recorder; restart
#                                       restore uses HA's separate restore_state
#                                       storage, so recorder history buys
#                                       nothing here and only gets pricier as
#                                       more families write into the tracker
#
# Feature-specific scripts/sensors live in their own package files
# (smarli_<family>.yaml â€” e.g. smarli_cover.yaml). This file holds only the
# tracker, which every family reads.
#
# Conventions (see CLAUDE.md in the blueprints repo):
#   - Tracker data model: data[namespace][key] = value
#   - Event `smarli_tracker_set`:    payload namespace/key/value -> upsert the key.
#   - Event `smarli_tracker_remove`: payload namespace/key       -> delete the key.
#     Writes are atomic per key.
#   - Namespace `shared` is cross-blueprint. Every key in it (and every
#     instance-scoped key in a family namespace) is named `<owner>::<name>`,
#     owner being an automation id, an entity_id, or the literal `global` — e.g.
#     `<cover>::suspension`, `<cover>::moving_<run>`, `<automation_id>::intent`
#     (see smarli_cover.yaml). `script.smarli_tracker_gc` below depends on every
#     key following this `<owner>::<name>` grammar: it is how GC recovers the
#     owner of a key without knowing any family's key names.
# ============================================================================

# ---------------------------------------------------------------------------
# Recorder exclusion.
# ---------------------------------------------------------------------------
# This is a debug-only KV store, not user-facing data — no dashboard or history
# graph needs it. Restart survival comes from HA's restore_state storage, which
# is independent of the recorder, so excluding this entity from the recorder
# loses nothing functionally while capping the cost of every tracker write
# (which otherwise re-snapshots the whole `data` attribute into the database).
# Developer Tools > States still shows the live `data` regardless.
recorder:
  exclude:
    entities:
      - sensor.smarli_automation_tracker

template:
  - trigger:
      - trigger: event
        event_type: smarli_tracker_set
      - trigger: event
        event_type: smarli_tracker_remove
    sensor:
      - name: "smarli. Automation Tracker"
        unique_id: smarli_automation_tracker
        icon: mdi:database-cog
        state: "ok"
        attributes:
          data: >
            {% set data = this.attributes.get('data', {}) if this is defined else {} %}
            {% if trigger is defined and trigger.event is defined %}
              {% set ev = trigger.event.data %}
              {% set etype = trigger.event.event_type %}
              {% set ns_name = ev.namespace | default('') %}
              {% set key = ev.key | default('') %}
              {% if ns_name == '' or key == '' %}
                {{ data }}
              {% else %}
                {% set bucket = data.get(ns_name, {}) %}
                {% if etype == 'smarli_tracker_remove' %}
                  {% set bucket = dict(bucket.items() | rejectattr('0', 'eq', key)) %}
                {% elif 'value' in ev %}
                  {% set bucket = dict(bucket.items() | list + [(key, ev.value)]) %}
                {% endif %}
                {{ dict(data.items() | list + [(ns_name, bucket)]) }}
              {% endif %}
            {% else %}
              {{ data }}
            {% endif %}

# ---------------------------------------------------------------------------
# Tracker garbage collection.
# ---------------------------------------------------------------------------
# Every instance-scoped or entity-scoped tracker key is named `<owner>::<name>`.
# `::` cannot appear in an entity_id and is not generated in automation ids, so
# the owner can always be recovered from the key without knowing which blueprint
# family wrote it. A key whose owner no longer exists is unreachable garbage:
# automation ids are regenerated on every create, so delete-and-recreate would
# otherwise leak a key per cycle, and every tracker write snapshots the whole
# `data` attribute into the recorder.
#
# Owner forms:  <automation id> | <entity_id> | the literal `global`
script:
  smarli_tracker_gc:
    alias: "smarli. Tracker Garbage Collection"
    description: >-
      Removes tracker keys whose owner (the part before `::`) is neither a live
      automation, nor a live entity, nor the reserved literal `global`. Keys
      without `::` are left alone.
    mode: single
    max_exceeded: silent
    sequence:
      - alias: Never sweep while the automation registry looks empty (mid-reload)
        condition: template
        value_template: "{{ states.automation | list | count > 0 }}"
      - variables:
          data: "{{ state_attr('sensor.smarli_automation_tracker', 'data') or {} }}"
          # A deleted automation leaves a permanent unavailable/restored ghost
          # entity behind (entity registry keeps the unique_id => attributes.id
          # survives in states.automation forever, even across restarts) — so
          # a plain domain scan would never see that id as dead. Excluding
          # 'unavailable' states drops the ghost while keeping every real
          # automation (which is always 'on' or 'off', never 'unavailable',
          # except in the empty-registry window already guarded above).
          live_ids: "{{ states.automation | rejectattr('state', 'eq', 'unavailable') | map(attribute='attributes.id') | select('string') | list }}"
          orphans: >
            {% set ns = namespace(dead=[]) %}
            {% for bucket_name, bucket in data.items() %}
              {% for key in bucket.keys() %}
                {% if '::' in key %}
                  {% set owner = key.split('::')[0] %}
                  {% set is_entity = owner is match('^[a-z_][a-z0-9_]*\.[a-z0-9_]+$') %}
                  {% set alive = owner == 'global'
                                 or owner in live_ids
                                 or (is_entity and states[owner] is not none) %}
                  {% if not alive %}
                    {% set ns.dead = ns.dead + [[bucket_name, key]] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.dead }}
      - alias: Remove every orphaned key
        repeat:
          for_each: "{{ orphans }}"
          sequence:
            - event: smarli_tracker_remove
              event_data:
                namespace: "{{ repeat.item[0] }}"
                key: "{{ repeat.item[1] }}"

automation:
  - id: smarli_tracker_gc
    alias: "smarli. Tracker Garbage Collection"
    description: >-
      Sweeps orphaned tracker keys. Deleting an automation fires
      `automation_reloaded`, so this runs exactly when ownership can have
      changed and costs nothing in steady state.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    actions:
      - alias: Let the reload finish before deciding who is alive
        delay:
          seconds: 10
      - action: script.smarli_tracker_gc
